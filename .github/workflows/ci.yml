name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install UI package dependencies
        working-directory: ui/react
        run: npm ci

      - name: Build dist artifacts
        run: npm run build:dist

      - name: Build MCP server
        run: npm run build:mcp

      - name: Run unit tests
        run: npm test -- --run
