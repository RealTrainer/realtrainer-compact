name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/react/package-lock.json
            docs-site/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install UI package dependencies
        working-directory: ui/react
        run: npm ci

      - name: Build local package artifacts
        run: npm run build:dist

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Install local package build into docs
        working-directory: docs-site
        run: npm install --no-save ../dist

      - name: Build site
        working-directory: docs-site
        env:
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/
          DOCUSAURUS_ORG: ${{ github.repository_owner }}
          DOCUSAURUS_PROJECT: ${{ github.event.repository.name }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
